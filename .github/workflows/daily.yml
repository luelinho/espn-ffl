name: Daily sync

on:
  schedule:
    - cron: "5 6 * * *"   # 06:05 UTC daily
  workflow_dispatch: {}   # allow manual triggering from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run daily sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASON_YEAR: ${{ secrets.SEASON_YEAR }}
        run: python -m src.daily_sync

      - name: Commit database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/league.sqlite
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
